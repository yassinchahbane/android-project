<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>3D Avatar AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1E1B4B 0%, #0B0F19 100%);
            font-family: monospace;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #holo-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background:
                radial-gradient(circle, transparent 45%, rgba(2,2,8,0.7) 100%),
                linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 100%, 100% 4px;
        }
        #loading-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00E5FF;
            font-size: 18px;
            font-family: monospace;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="holo-overlay"></div>
    <div id="loading-text">🔮 Loading 3D Avatar...</div>

    <!-- Three.js r160 + addons via importmap -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, clock, controls;
        let model, mixer;
        let animations = [];
        let currentAction = null;
        let state = "idle";
        let voiceIntensity = 0;
        let time = 0;
        let glowLight, rimLight;

        // Multiple Morph Targets array to sync Head + Teeth + Beard
        let mouthTargets = [];

        // Skeleton Bones variables for custom talking gestures
        let spineBone = null;
        let headBone = null;
        let leftArmBone = null;
        let rightArmBone = null;

        const STATES = {
            idle:      { glowColor: 0x00E5FF, intensity: 1.8, rimColor: 0x0077AA },
            listening: { glowColor: 0x00E5FF, intensity: 2.8, rimColor: 0x0077AA },
            thinking:  { glowColor: 0xAA00FF, intensity: 3.2, rimColor: 0x7B1FA2 },
            speaking:  { glowColor: 0x00E5FF, intensity: 2.2, rimColor: 0x0077AA } // Removed green (0x00E676) -> Sleek high-tech cyan!
        };

        let targetGlowColor = new THREE.Color(STATES.idle.glowColor);
        let targetRimColor = new THREE.Color(STATES.idle.rimColor);
        let targetIntensity = STATES.idle.intensity;

        function init() {
            clock = new THREE.Clock();

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0B0F19, 0.012);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.4, 2.2); // Start closer to the chest/face
            camera.lookAt(0, 1.2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.4;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // === Orbit Controls (Zoom, Pan, Rotate) ===
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 0.6;
            controls.maxDistance = 5;
            controls.target.set(0, 1.2, 0);
            controls.maxPolarAngle = Math.PI / 2 + 0.1;

            // === High-Vibrancy Lighting ===
            const ambient = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(2, 4, 3);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x87CEEB, 0.8);
            fillLight.position.set(-3, 2, 2);
            scene.add(fillLight);

            glowLight = new THREE.PointLight(STATES.idle.glowColor, STATES.idle.intensity, 10);
            glowLight.position.set(0, 1.2, 1.8);
            scene.add(glowLight);

            rimLight = new THREE.PointLight(STATES.idle.rimColor, 2.0, 8);
            rimLight.position.set(0, 1.5, -2.0);
            scene.add(rimLight);

            // === Sleek Grid ===
            const gridHelper = new THREE.GridHelper(20, 40, 0x00E5FF, 0x001d2d);
            gridHelper.position.y = -0.01;
            gridHelper.material.opacity = 0.4;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // === Platform ===
            const platformGeom = new THREE.CylinderGeometry(0.8, 0.9, 0.05, 64);
            const platformMat = new THREE.MeshStandardMaterial({
                color: 0x0b1d3a,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x002c5c,
                emissiveIntensity: 0.5
            });
            const platform = new THREE.Mesh(platformGeom, platformMat);
            platform.position.y = -0.025;
            platform.receiveShadow = true;
            scene.add(platform);

            // === glowing Ring ===
            const ringGeom = new THREE.RingGeometry(0.85, 0.9, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00E5FF,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.01;
            scene.add(ring);

            // === Load GLB Model ===
            const loadingEl = document.getElementById('loading-text');
            const loader = new GLTFLoader();

            loader.load(
                'model.glb',
                function(gltf) {
                    model = gltf.scene;
                    model.position.set(0, 0, 0);
                    model.scale.set(1, 1, 1);

                    model.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;

                            if (child.material) {
                                if (child.material.map) {
                                    child.material.map.anisotropy = 8;
                                    child.material.map.minFilter = THREE.LinearMipmapLinearFilter;
                                }
                                child.material.roughness = Math.min(child.material.roughness, 0.6);
                            }

                            // Dynamic Morph Targets Scan (Sync Head, Teeth, Tongue meshes!)
                            if (child.morphTargetDictionary) {
                                console.log('Scanning Morph Target Mesh:', child.name);
                                for (let key in child.morphTargetDictionary) {
                                    let k = key.toLowerCase();
                                    if (k.includes("jawopen") || k.includes("mouthopen") || k.includes("viseme_aa") || k === "jaw_open" || k.includes("mouth_open")) {
                                        mouthTargets.push({
                                            mesh: child,
                                            index: child.morphTargetDictionary[key]
                                        });
                                        console.log('-> Bound LipSync:', child.name, 'target:', key);
                                    }
                                }
                            }
                        }

                        // Locate skeleton bones for real-time speech gestures!
                        if (child.isBone) {
                            let name = child.name.toLowerCase();
                            if (name.includes("spine") || name.includes("chest")) {
                                spineBone = child;
                            }
                            if (name.includes("head") || name.includes("neck")) {
                                headBone = child;
                            }
                            if (name.includes("leftarm") || name.includes("leftshoulder")) {
                                leftArmBone = child;
                            }
                            if (name.includes("rightarm") || name.includes("rightshoulder")) {
                                rightArmBone = child;
                            }
                        }
                    });

                    scene.add(model);

                    // Setup animation mixer
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        animations = gltf.animations;
                        currentAction = mixer.clipAction(animations[0]);
                        currentAction.play();
                        console.log('Loaded ' + animations.length + ' animations');
                    }

                    loadingEl.style.display = 'none';
                    console.log('Avatar loaded smoothly!');
                },
                function(progress) {
                    if (progress.total > 0) {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        loadingEl.textContent = '🔮 Loading Avatar: ' + pct + '%';
                    }
                },
                function(error) {
                    console.error('GLB Load Error:', error);
                    loadingEl.textContent = '❌ Failed to load model. Error: ' + error.message;
                    loadingEl.style.color = '#FF5252';
                }
            );

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // === Bridge Functions (called by Android Java) ===
        window.setAvatarState = function(newState) {
            if (STATES[newState]) {
                state = newState;
                targetGlowColor.setHex(STATES[state].glowColor);
                targetRimColor.setHex(STATES[state].rimColor);
                targetIntensity = STATES[state].intensity;

                if (mixer && animations.length > 1) {
                    let clipIndex = 0;
                    if (newState === "idle") clipIndex = 0;
                    else if (newState === "listening") clipIndex = Math.min(1, animations.length - 1);
                    else if (newState === "thinking") clipIndex = Math.min(2, animations.length - 1);
                    else if (newState === "speaking") clipIndex = Math.min(1, animations.length - 1);

                    const nextAction = mixer.clipAction(animations[clipIndex]);
                    if (currentAction !== nextAction) {
                        nextAction.reset();
                        nextAction.crossFadeFrom(currentAction, 0.4, true);
                        nextAction.play();
                        currentAction = nextAction;
                    }
                }

                if (currentAction) {
                    if (newState === "thinking") currentAction.timeScale = 0.5;
                    else if (newState === "speaking") currentAction.timeScale = 1.3;
                    else if (newState === "listening") currentAction.timeScale = 0.8;
                    else currentAction.timeScale = 1.0;
                }
            }
        };

        window.setVoiceIntensity = function(intensity) {
            voiceIntensity = intensity;
        };

        // Standard alias helpers
        window.setVoiceIntensityAlias = setVoiceIntensity;
        window.setAvatarStateAlias = setAvatarState;

        // === Render Loop ===
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            time += delta;

            if (mixer) mixer.update(delta);
            if (controls) controls.update();

            glowLight.color.lerp(targetGlowColor, 0.08);
            rimLight.color.lerp(targetRimColor, 0.08);
            glowLight.intensity += (targetIntensity - glowLight.intensity) * 0.08;

            if (state === "speaking") {
                glowLight.intensity = targetIntensity + voiceIntensity * 3.5;
                glowLight.distance = 10 + voiceIntensity * 5;
                if (model) {
                    const breathe = 1.0 + voiceIntensity * 0.02;
                    model.scale.set(breathe, breathe, breathe);
                }

                // Dynamic, organic real-time skeleton gestures during speech!
                // This makes the character gesture dynamically while talking!
                if (spineBone) {
                    spineBone.rotation.y = Math.sin(time * 2.2) * 0.06;
                    spineBone.rotation.x = Math.sin(time * 1.5) * 0.03;
                }
                if (headBone) {
                    headBone.rotation.y = Math.cos(time * 1.4) * 0.07;
                    headBone.rotation.x = Math.sin(time * 2.8) * 0.04 + 0.02; // Nodding chest/head
                }
                if (leftArmBone) {
                    // Natural arm lift and dynamic speaking gestures
                    leftArmBone.rotation.z = -0.5 - Math.sin(time * 1.8) * 0.1;
                    leftArmBone.rotation.x = Math.cos(time * 1.8) * 0.06;
                }
                if (rightArmBone) {
                    // Natural right arm gesture
                    rightArmBone.rotation.z = 0.5 + Math.cos(time * 2.0) * 0.1;
                    rightArmBone.rotation.x = Math.sin(time * 2.0) * 0.06;
                }
            } else {
                glowLight.distance = 10;
                if (model) {
                    const idleBreathe = 1.0 + Math.sin(time * 1.5) * 0.005;
                    model.scale.set(idleBreathe, idleBreathe, idleBreathe);
                }

                // Smoothly return bones back to their neutral resting state
                if (spineBone) spineBone.rotation.y += (0 - spineBone.rotation.y) * 0.1;
                if (spineBone) spineBone.rotation.x += (0 - spineBone.rotation.x) * 0.1;
                if (headBone) headBone.rotation.y += (0 - headBone.rotation.y) * 0.1;
                if (headBone) headBone.rotation.x += (0 - headBone.rotation.x) * 0.1;
                if (leftArmBone) leftArmBone.rotation.z += (0 - leftArmBone.rotation.z) * 0.1;
                if (leftArmBone) leftArmBone.rotation.x += (0 - leftArmBone.rotation.x) * 0.1;
                if (rightArmBone) rightArmBone.rotation.z += (0 - rightArmBone.rotation.z) * 0.1;
                if (rightArmBone) rightArmBone.rotation.x += (0 - rightArmBone.rotation.x) * 0.1;
            }

            // Real-time lip sync morph target driver!
            for (let target of mouthTargets) {
                if (state === "speaking") {
                    target.mesh.morphTargetInfluences[target.index] = voiceIntensity * 0.85;
                } else {
                    target.mesh.morphTargetInfluences[target.index] += (0 - target.mesh.morphTargetInfluences[target.index]) * 0.22;
                }
            }

            if (model) {
                model.position.y = Math.sin(time * 1.2) * 0.01;
            }

            if (state === "thinking" && model) {
                model.rotation.y = Math.sin(time * 0.8) * 0.08;
            } else if (model) {
                model.rotation.y += (0 - model.rotation.y) * 0.05;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
